<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Малювання</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: #f0f0f0;
    }
    #canvas {
      display: block;
      touch-action: none;
    }
    .tools {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      flex-wrap: wrap;
    }
    .tools input[type="color"],
    .tools input[type="range"],
    .tools button {
      font-size: 16px;
      padding: 6px 8px;
    }
  </style>
</head>
<body>
  <div class="tools">
    <input type="color" id="colorPicker" value="#000000">
    <input type="range" id="lineWidth" min="1" max="30" value="5">
    <button id="undo">◀️ Назад</button>
    <button id="redo">Вперед ▶️</button>
    <button id="eraser">Ластик</button>
    <button id="clear">Очистити</button>
  </div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const colorPicker = document.getElementById('colorPicker');
    const lineWidth = document.getElementById('lineWidth');
    const eraser = document.getElementById('eraser');
    const clear = document.getElementById('clear');
    const undoBtn = document.getElementById('undo');
    const redoBtn = document.getElementById('redo');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      restoreCanvas();
    }

    let drawing = false;
    let currentColor = colorPicker.value;
    let currentLineWidth = lineWidth.value;
    let isErasing = false;
    let history = [];
    let redoStack = [];

    function saveCanvas() {
      history.push(canvas.toDataURL());
      if (history.length > 100) history.shift(); // обмеження історії
      redoStack = [];
    }

    function restoreCanvas() {
      if (history.length === 0) return;
      const img = new Image();
      img.src = history[history.length - 1];
      img.onload = () => ctx.drawImage(img, 0, 0);
    }

    function undo() {
      if (history.length > 1) {
        redoStack.push(history.pop());
        const img = new Image();
        img.src = history[history.length - 1];
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
        };
      }
    }

    function redo() {
      if (redoStack.length > 0) {
        const imgData = redoStack.pop();
        history.push(imgData);
        const img = new Image();
        img.src = imgData;
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
        };
      }
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      if (e.touches) {
        return {
          x: e.touches[0].clientX - rect.left,
          y: e.touches[0].clientY - rect.top
        };
      } else {
        return {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        };
      }
    }

    function startDrawing(e) {
      drawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!drawing) return;
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.strokeStyle = isErasing ? '#ffffff' : currentColor;
      ctx.lineWidth = currentLineWidth;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    function stopDrawing() {
      if (drawing) {
        drawing = false;
        ctx.closePath();
        saveCanvas();
      }
    }

    colorPicker.addEventListener('input', () => {
      currentColor = colorPicker.value;
      isErasing = false;
    });

    lineWidth.addEventListener('input', () => {
      currentLineWidth = lineWidth.value;
    });

    eraser.addEventListener('click', () => isErasing = true);
    clear.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      saveCanvas();
    });

    undoBtn.addEventListener('click', undo);
    redoBtn.addEventListener('click', redo);

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseout', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDrawing);

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('beforeunload', () => {
      const image = canvas.toDataURL("image/png");
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.sendData(image);
      }
    });

    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.expand();
    }

    resizeCanvas();
    saveCanvas();
  </script>
</body>
</html>
